# Local Postgres for tests only (docs/06-test-plan.md §2). Dev and production stay on Neon.
# `wsproxy` lets the Neon serverless driver (WebSocket) talk to plain Postgres, so tests run the
# same driver as production. Data lives in tmpfs: it's thrown away when the container stops.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: curio
      POSTGRES_PASSWORD: curio
      POSTGRES_DB: curio_test
    command:
      ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'full_page_writes=off']
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U curio -d curio_test']
      interval: 1s
      retries: 30

  wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      APPEND_PORT: 'postgres:5432'
      ALLOW_ADDR_REGEX: '.*'
      LOG_TRAFFIC: 'false'
    ports:
      - '5433:80'
    depends_on:
      postgres:
        condition: service_healthy
